services:
  ppanel-db:
    # 【必须和 test 同一种数据库】上游的 pg 支持是靠方言分支实现的
    # （db.Dialector.Name() 散布在各 repo），本机跑 MySQL 就复现不了 test 上
    # 的方言问题——那正是本机栈存在的意义。
    image: postgres:17.11-alpine
    container_name: ppanel-db
    restart: always
    networks:
      - ppanel-network
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: ppanel
      POSTGRES_USER: ppanel
      POSTGRES_PASSWORD: ppanelpassword
    volumes:
      - ./db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppanel -d ppanel"]
      interval: 10s
      timeout: 5s
      retries: 3

  ppanel-cache:
    image: redis:7.4.5
    container_name: ppanel-cache
    restart: always
    networks:
      - ppanel-network
    ports:
      - 6379:6379
    volumes:
      - ./cache:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  ppanel-server:
    image: ppanel/ppanel-server:latest
    container_name: ppanel-server
    restart: always
    networks:
      - ppanel-network
    ports:
      - 8080:8080
    depends_on:
      ppanel-db:
        condition: service_healthy
      ppanel-cache:
        condition: service_healthy
    volumes:
      - ./config/ppanel.yaml:/app/etc/ppanel.yaml

  ppanel-admin:
    image: ppanel/ppanel-admin-web:latest
    container_name: ppanel-admin-web
    restart: always
    networks:
      - ppanel-network
    ports:
      - 3001:3000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      ppanel-server:
        condition: service_started

  ppanel-user:
    image: ppanel/ppanel-user-web:latest
    container_name: ppanel-user-web
    restart: always
    networks:
      - ppanel-network
    ports:
      - 3002:3000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      ppanel-server:
        condition: service_started

networks:
  ppanel-network:
    driver: bridge
